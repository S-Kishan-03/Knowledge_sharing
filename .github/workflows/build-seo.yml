name: Build SEO Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/generate-sitemap.js'
  workflow_dispatch:

jobs:
  build-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build search index
        run: npm run build:search

      - name: Generate SEO artifacts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          BASE_PATH: ${{ secrets.BASE_PATH }}
        run: npm run build:seo

      - name: Commit SEO artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt data/search-index.json data/structured-data.json data/og-meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update SEO artifacts [skip ci]"
            git push
          fi