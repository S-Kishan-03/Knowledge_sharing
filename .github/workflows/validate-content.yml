name: Validate Content

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate topic JSON files
        run: npm run validate

      - name: Build search index
        run: npm run build:search

      - name: Verify search index generated
        run: |
          if [ ! -f data/search-index.json ]; then
            echo "❌ search-index.json not generated"
            exit 1
          fi
          echo "✅ search-index.json exists"