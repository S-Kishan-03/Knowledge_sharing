<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MechWiki | Mechanical Engineering Knowledge Hub</title>
  <meta name="description" content="Modern Mechanical Engineering Knowledge Hub with interactive unit-aware calculators, formula references, and deep-dive technical topics.">
  <meta property="og:title" content="MechWiki | Mechanical Engineering Knowledge Hub">
  <meta property="og:description" content="Modern Mechanical Engineering Knowledge Hub with interactive unit-aware calculators, formula references, and deep-dive technical topics.">
  <meta property="og:type" content="website">
  
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('mechwiki_theme');
        var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Plus Jakarta Sans & JetBrains Mono for clean engineering display & tabular math -->
